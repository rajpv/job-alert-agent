name: Job Alert Agent

on:
  # Triggered externally by Google Apps Script every 30 minutes
  # (GitHub's built-in cron was unreliable, so we use an external scheduler)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Search mode: general or company'
        required: false
        default: 'general'
        type: choice
        options:
          - general
          - company

permissions:
  contents: write

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load seen jobs state
        uses: actions/cache@v4
        with:
          path: data/seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Run Job Alert Agent
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          MODE="${{ github.event.inputs.mode || 'general' }}"
          python main.py --mode $MODE

      - name: Commit updated state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs state [skip ci]"
          git push
